name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint + format + typecheck su tutto il monorepo
      - run: pnpm check

      # La build deve passare prima di ogni merge (docs/06 §5)
      - run: pnpm build

      # Vulnerabilità note nelle dipendenze
      - run: pnpm audit --audit-level high
        continue-on-error: true
